[tool.poetry]
name = "twitter-clone"
version = "0.1.0"
description = "Clone funcional do Twitter - projeto final EBAC"
authors = ["Henrique Lustosa <henriquelustosa@yahoo.com.br>"]
license = "MIT"


[tool.poetry.dependencies]
python = ">=3.10,<4"
Django = "^3.2.8"
django-rest-framework = "^0.1.0"
django-extensions = "^3.1.3"
django-debug-toolbar = "^3.2.2"
psycopg2-binary = "^2.9.11"
autopep8 = "^1.6.0"
flake8 = "^4.0.1"
isort = "^5.10.1"
gunicorn = "^22.0.0"
whitenoise = "^5.3.0"
gitpython = "^3.1.37"
requests = "^2.32.3"
django-cloudinary-storage = "^0.3.0"
legacy-cgi = "^2.6.4"
pillow = "^11.3.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
factory-boy = "^3.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"