<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twitter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/6e2cfd2e5b.js"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        --tw-blue: #1d9bf0;
        --tw-blue-hover: #1a8cd8;
        --tw-text: #0f1419;
        --tw-muted: #536471;
        --tw-border: #eff3f4;
        --tw-bg-soft: #f7f9f9;
      }

      body {
        background-color: #ffffff;
        color: var(--tw-text);
      }

      a {
        color: var(--tw-blue);
      }
      a:hover {
        color: var(--tw-blue-hover);
      }

      .navbar {
        background-color: #ffffff !important;
        border-bottom: 1px solid var(--tw-border);
      }
      .navbar .navbar-brand {
        color: var(--tw-blue) !important;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .navbar .nav-link {
        color: var(--tw-text) !important;
      }
      .navbar .nav-link:hover {
        color: var(--tw-blue) !important;
      }

      .btn-secondary,
      .btn-outline-secondary {
        --bs-btn-color: var(--tw-blue);
        --bs-btn-border-color: var(--tw-blue);
        --bs-btn-hover-color: #fff;
        --bs-btn-hover-bg: var(--tw-blue);
        --bs-btn-hover-border-color: var(--tw-blue);
        --bs-btn-active-bg: var(--tw-blue-hover);
        --bs-btn-active-border-color: var(--tw-blue-hover);
      }
      .btn-secondary {
        --bs-btn-bg: var(--tw-blue);
        --bs-btn-color: #fff;
      }

      .alert-dark {
        background-color: var(--tw-bg-soft);
        border-color: var(--tw-border);
        color: var(--tw-text);
      }
    </style>
  </head>
  <body>
    {% include "navbar.html" %}
    <div class="container">
      <br />
      {% if messages %} {% for message in messages %}
      <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endif %} {% block content %} {% endblock %}
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
